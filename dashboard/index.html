<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyberbrain</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f7f4; --fg:#20211f; --muted:#6c7069; --line:#deded6; --panel:#fffefa; --accent:#2c6f6d; --done:#5b6f43; }
    @media (prefers-color-scheme: dark) { :root { --bg:#171817; --fg:#eceee8; --muted:#a1a69c; --line:#34362f; --panel:#20221f; --accent:#86c9c2; --done:#a6c47b; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(980px, calc(100vw - 32px)); margin: 28px auto 56px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 24px; font-weight: 720; letter-spacing: 0; }
    .counts { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .bar { display: flex; gap: 10px; margin-bottom: 18px; }
    input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; }
    label { display: inline-flex; align-items: center; gap: 7px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); user-select: none; white-space: nowrap; }
    details { border-top: 1px solid var(--line); }
    details:last-child { border-bottom: 1px solid var(--line); }
    summary { cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "›"; color: var(--muted); font-size: 22px; transform: rotate(0deg); transition: transform .12s ease; }
    details[open] summary::before { transform: rotate(90deg); }
    .thread-title { flex: 1; min-width: 0; }
    .thread-name { font-weight: 690; }
    .summary { color: var(--muted); margin-left: 8px; }
    .badge { color: var(--muted); font-size: 13px; white-space: nowrap; }
    ul { list-style: none; margin: 0 0 14px 25px; padding: 0; }
    li { margin: 7px 0; }
    .task { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: baseline; }
    .dot { color: var(--accent); font-weight: 780; }
    .done .dot, .done .text { color: var(--done); }
    .done .text { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, var(--done), transparent 45%); }
    .date { color: var(--muted); font-size: 13px; }
    .notes { margin: 5px 0 8px 26px; color: var(--muted); font-size: 14px; }
    .notes a { color: var(--accent); text-decoration: none; }
    .notes a:hover { text-decoration: underline; }
    .empty, .error { color: var(--muted); padding: 28px 0; }
    @media (max-width: 620px) {
      main { width: min(100vw - 24px, 980px); margin-top: 18px; }
      header { display: block; }
      .counts { margin-top: 4px; white-space: normal; }
      .bar { display: block; }
      label { margin-top: 8px; width: 100%; }
      summary { align-items: flex-start; }
      .summary { display: block; margin: 2px 0 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Cyberbrain</h1>
      <div id="counts" class="counts"></div>
    </header>
    <div class="bar">
      <input id="search" type="search" placeholder="Filter threads and tasks" autocomplete="off">
      <label><input id="openOnly" type="checkbox" checked> Open only</label>
    </div>
    <section id="threads"></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let state = { threads: [], counts: { threads: 0, open: 0, done: 0 } };

    const esc = value => String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    const matches = (thread, q) => !q || [thread.name, thread.summary, ...thread.tasks.flatMap(t => [t.text, ...t.notes.map(n => n.text), ...t.children.map(c => c.text)])].join(" ").toLowerCase().includes(q);

    function noteHtml(note) {
      if (!note.links.length) return esc(note.text);
      return note.links.map(link => `<a href="${esc(link.url)}">${esc(link.label)}</a> <span>(${esc(link.source)})</span>`).join(", ");
    }

    function taskHtml(task, openOnly) {
      if (openOnly && task.done) return "";
      const children = task.children.map(child => taskHtml(child, openOnly)).join("");
      const notes = task.notes.length ? `<div class="notes">${task.notes.map(noteHtml).join("<br>")}</div>` : "";
      return `<li>
        <div class="task ${task.done ? "done" : ""}">
          <span class="dot">${task.done ? "✓" : "○"}</span>
          <span class="text">${esc(task.text)}</span>
          <span class="date">${task.date ? esc(task.date) : ""}</span>
        </div>
        ${notes}${children ? `<ul>${children}</ul>` : ""}
      </li>`;
    }

    function render() {
      const q = $("search").value.trim().toLowerCase();
      const openOnly = $("openOnly").checked;
      $("counts").textContent = `${state.counts.threads} threads · ${state.counts.open} open · ${state.counts.done} completed`;
      const threads = state.threads.filter(thread => matches(thread, q)).map(thread => {
        const tasks = thread.tasks.map(task => taskHtml(task, openOnly)).join("");
        if (openOnly && !tasks) return "";
        const summary = thread.summary ? `<span class="summary">${esc(thread.summary)}</span>` : "";
        return `<details open>
          <summary>
            <span class="thread-title"><span class="thread-name">${esc(thread.name)}</span>${summary}</span>
            <span class="badge">${thread.counts.open} open · ${thread.counts.done} done</span>
          </summary>
          ${tasks ? `<ul>${tasks}</ul>` : `<div class="empty">No tasks</div>`}
        </details>`;
      }).join("");
      $("threads").innerHTML = threads || `<div class="empty">No matching tasks</div>`;
    }

    async function load() {
      try {
        state = await fetch(`/api/threads?ts=${Date.now()}`).then(response => response.json());
        render();
      } catch (error) {
        $("threads").innerHTML = `<div class="error">${esc(error.message)}</div>`;
      }
    }

    $("search").addEventListener("input", render);
    $("openOnly").addEventListener("change", render);
    load();
  </script>
</body>
</html>
